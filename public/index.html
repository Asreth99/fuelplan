<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Dark mode before the first paint: the same choice next-themes (Chakra's provider) stores
      under "theme" ("light" / "dark" / "system"). Without this, dark-mode users get a white flash.
    -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
    <style>
      html.dark,
      html.dark body {
        background: #0a1311;
      }
    </style>
    <link rel="icon" href="%PUBLIC_URL%/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />

    <meta name="theme-color" content="#0a3d33" />
    <meta
      name="description"
      content="Plan a trip and see what the fuel will cost, split between passengers."
    />
    <!-- Home-screen icon on iPhone: a full-bleed square, iOS rounds the corners itself -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Fuel Plan</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
