<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FuelPlan — A. Clean, map-native</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../prototype-code/layout.css">
<style>
  /* Direction A: calm, familiar, map-native. White surfaces, soft shadows, one blue accent. */
  :root {
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

    --bg: #f6f7f9;
    --text: #1f2328;
    --muted: #5f6670;
    --muted-2: #b7bdc6;

    --surface: #ffffff;
    --surface-solid: #ffffff;
    --card-border: transparent;
    --border: #e7e9ee;
    --field: #f2f4f7;
    --field-border: #f2f4f7;
    --chip-bg: #ffffff;
    --row-bg: #ffffff;

    --accent: #1a73e8;
    --accent-soft: #e8f0fe;
    --accent-text: #1a5fc8;
    --on-accent: #ffffff;

    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 6px 20px rgba(16, 24, 40, 0.1);

    --rail-bg: #ffffff;
    --rail-text: #1f2328;
    --rail-muted: #5f6670;
    --rail-active: #1a5fc8;
    --rail-active-bg: #e8f0fe;

    --locate-halo: #e3eafd;
    --locate-dot: #1e5eff;

    --map-land: #f1efe9;
    --map-park: #d9ecd2;
    --map-water: #aed4f3;
    --map-road: #ffffff;
    --map-major: #fde3a7;
    --map-major-casing: #ecc77a;
    --map-route: #1a73e8;
    --map-route-casing: #1557b0;
    --map-pin: #ea4335;
    --map-label: #4a4f57;
  }
</style>
